[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-assistant"
version = "0.1.0"
description = "Asistente conversacional de reglas y cartas de Magic: The Gathering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic[bedrock]>=0.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    # Carga de configuracion por capas: entorno > config/defaults.toml.
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "streamlit>=1.33",
]

[project.optional-dependencies]
ingest = ["pypdf>=4.2"]
# Bedrock viene en las dependencias base porque es el proveedor por defecto.
# Este extra queda como alias explicito para quien lea el pyproject.
bedrock = ["anthropic[bedrock]>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pypdf>=4.2",
]

[project.scripts]
mtg-ingest = "mtg_assistant.rag.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends(...)` en el default de un parametro es el idioma de FastAPI.
ignore = ["B008"]
